[build-system]
requires = ["setuptools>=61.0", "cython>=3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mib2h5"
version = "0.0.1"
description = "Python wrapper for MIB to HDF5 conversion"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Timothy Poon", email = "timothy0626@gmail.com"},
]
keywords = ["MIB",
            "HDF5",
            "MerlinEM",
            "Quantum Detector",
            "electron microscopy",
            "data conversion",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = [
    "pytest",
    "h5py>=3.0",
]

[project.scripts]
mib2h5 = "mib2h5.cli:main"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
]
